[package]
name = "carbon-popi-decoder"
version = "0.1.0"
edition = { workspace = true }
description = "Carbon decoder for popi.wtf launchpad on Solana"
license = { workspace = true }
readme = "README.md"
repository = { workspace = true }
authors = ["popi.wtf contributors"]
keywords = ["solana", "decoder", "popi", "launchpad"]
categories = ["encoding"]

[lib]
crate-type = ["rlib"]

[features]
default = []

serde = ["dep:serde", "dep:serde-big-array"]

[dependencies]
carbon-core = { workspace = true, features = ["macros"] }
borsh = { workspace = true, features = ["derive"] }
solana-pubkey = { workspace = true, features = ["borsh"] }
solana-account = { workspace = true }
solana-instruction = { workspace = true }
serde_json = { workspace = true }

serde = { workspace = true, features = ["derive"], optional = true }
serde-big-array = { workspace = true, optional = true }


[dev-dependencies]
carbon-test-utils = { workspace = true }
