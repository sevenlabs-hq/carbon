[package]
name = "carbon-yellowstone-grpc-datasource"
description = "Yellowstone gRPC Datasource"
license = { workspace = true }
version = "2.0.0"
rust-version = { workspace = true }
edition = { workspace = true }
readme = "README.md"
repository = { workspace = true }
homepage = "https://carbon.sevenlabs.org/datasources/yellowstone-grpc"
keywords = ["solana", "indexer", "yellowstone", "datasource"]
categories = ["encoding"]

[lib]
crate-type = ["rlib"]

[dependencies]
solana-account = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }

carbon-core = { workspace = true, features = ["yellowstone"] }

async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
# tls-ring lets tonic fall back to ring when the application installs no rustls provider.
# Pinned here: the workspace entry stays on tonic 0.13 to match misc/jito-protos' tonic-build.
tonic = { version = "0.14.6", default-features = false, features = ["tls-ring"] }
yellowstone-grpc-client = { workspace = true }
yellowstone-grpc-proto = { workspace = true }
