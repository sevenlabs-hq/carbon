[package]
name = "carbon-helius-laserstream-datasource"
description = "Helius Laserstream Datasource with automatic reconnection and slot replay"
license = { workspace = true }
version = "2.0.0"
rust-version = { workspace = true }
edition = { workspace = true }
readme = "README.md"
repository = { workspace = true }
keywords = ["solana", "indexer", "laserstream", "datasource", "helius"]
categories = ["encoding"]

[lib]
crate-type = ["rlib"]

[dependencies]
solana-account = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }

carbon-core = { workspace = true, features = ["yellowstone"] }

async-trait = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
# tls-ring lets tonic fall back to ring when the application installs no rustls provider.
# Pinned here: the workspace entry stays on tonic 0.13 to match misc/jito-protos' tonic-build.
tonic = { version = "0.14.6", default-features = false, features = ["tls-ring"] }
uuid = { workspace = true }
yellowstone-grpc-client = { workspace = true }
yellowstone-grpc-proto = { workspace = true }
