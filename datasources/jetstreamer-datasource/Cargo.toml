[package]
name = "carbon-jetstreamer-datasource"
description = "Carbon Jetstreamer Datasource"
license = { workspace = true }
version = "2.0.0"
# Cargo cannot publish a crate with a git dependency, and adding a `version` to
# the pin would silently publish against crates.io 0.7.0, still on Solana v3.
# Remove once upstream releases anza-xyz/jetstreamer#95.
publish = false
rust-version = { workspace = true }
edition = { workspace = true }
readme = "README.md"
repository = { workspace = true }
keywords = ["solana", "indexer", "jetstreamer", "datasource"]
categories = ["encoding"]

[lib]
crate-type = ["rlib"]

[dependencies]
solana-pubkey = { workspace = true }
solana-transaction-status-client-types = { workspace = true }

carbon-core = { workspace = true }

async-trait = { workspace = true }
futures-util = { workspace = true }
jetstreamer-firehose = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tokio-util = { workspace = true }
